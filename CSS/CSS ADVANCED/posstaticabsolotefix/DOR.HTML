<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Full Doraemon</title>
    <link rel="stylesheet" href="DOR.CSS">
</head>

<body>

    <div class="doraemon">

        <!-- Head -->
        <div class="head">
            <div class="eyes">
                <div class="eye left">
                    <div class="pupil"></div>
                </div>
                <div class="eye right">
                    <div class="pupil"></div>
                </div>
            </div>

            <div class="nose"></div>

            <div class="mouth"></div>

            <div class="whiskers left">
                <span></span><span></span><span></span>
            </div>
            <div class="whiskers right">
                <span></span><span></span><span></span>
            </div>
        </div>

        <!-- Body -->
        <div class="body">
            <div class="pocket"></div>
            <div class="bell"></div>
        </div>

        <!-- Legs -->
        <div class="legs">
            <div class="leg"></div>
            <div class="leg"></div>
        </div>

    </div>

</body>

</html>

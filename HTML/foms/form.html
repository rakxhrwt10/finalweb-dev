<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="/server">
        <label   for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="1" max="120"><br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <!-- <input type="submit" value="Submit">
        <input type="reset" value="Reset"> -->

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>

    </form>
    <hr>

    <form action="https://www.youtube.com/results?search_query=google+ai
    ">
    <input type="text" placeholder="Search on YouTube" name="search_query">
    <button>Search</button>

    <hr>

   


</form>

<form action="https://www.google.com/search" method="get">
    <input type="search" name="q" placeholder="Search on Google">
    <button type="submit">Search</button>
</form>
    
</body>
</html>
